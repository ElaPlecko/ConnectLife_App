<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectLife App Management Portal</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span></div>
        <div>
          <strong>ConnectLife</strong>
          <small>Manager</small>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" type="button" data-view="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.4 12 4l9 7.4v8.1a1.5 1.5 0 0 1-1.5 1.5H15v-6H9v6H4.5A1.5 1.5 0 0 1 3 19.5z" /></svg>
          Dashboard
        </button>

        <p>Configuration</p>
        <button class="nav-item" type="button" data-view="markets">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3c2.1 2.4 3.2 5.4 3.2 9S14.1 18.6 12 21M12 3c-2.1 2.4-3.2 5.4-3.2 9s1.1 6.6 3.2 9" /></svg>
          Markets
        </button>
        <button class="nav-item" type="button" data-view="segments">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-2a4 4 0 0 0-8 0v2M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-2.5a4 4 0 0 0-3-3.8M16 4.3a4 4 0 0 1 0 7.4" /></svg>
          Segments
        </button>
        <button class="nav-item" type="button" data-view="features">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 5v4M8 15v4" /></svg>
          Features
        </button>
        <button class="nav-item" type="button" data-view="content">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" /><path d="M14 3v6h6M8 13h8M8 17h8M8 9h2" /></svg>
          Content
        </button>
        <button class="nav-item" type="button" data-view="links">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.1 0l2.1-2.1a5 5 0 0 0-7.1-7.1L11 4.9M14 11a5 5 0 0 0-7.1 0l-2.1 2.1a5 5 0 0 0 7.1 7.1L13 19.1" /></svg>
          External Links
        </button>

        <p>Demo &amp; Tools</p>
        <button class="nav-item" type="button" data-view="comparison">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M7 6h10M6 6l-3 7h6zM18 6l-3 7h6zM5 21h14" /></svg>
          Market Comparison
        </button>
        <button class="nav-item" type="button" data-view="api">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6M14 4l-4 16" /></svg>
          API Explorer
        </button>

        <p>Admin</p>
        <button class="nav-item" type="button" data-view="users">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8" /></svg>
          Users
        </button>
        <button class="nav-item" type="button" data-view="audit">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg>
          Audit Log
        </button>
        <button class="nav-item" type="button" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 0 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 0 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.6-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1A2 2 0 0 1 7.1 4l.1.1a1.7 1.7 0 0 0 1.9.3h.1A1.7 1.7 0 0 0 10 2.9V3a2 2 0 0 1 4 0v-.1a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1A2 2 0 0 1 19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.6 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5.9z" /></svg>
          Settings
        </button>
      </nav>

      <div class="environment">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 8h.01M11 12h1v5h1" /></svg>
        <strong>POC environment</strong>
        <span>This is a proof of concept and not a production system.</span>
      </div>
    </aside>

    <main class="app-shell">
      <header class="topbar">
        <h1>ConnectLife App Management Portal (POC)</h1>
        <div class="user-tools">
          <button class="icon-button" type="button" aria-label="Help">?</button>
          <button class="login-button" type="button">Prijava</button>
        </div>
      </header>

      <section class="dashboard" id="app-view" aria-live="polite"></section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
